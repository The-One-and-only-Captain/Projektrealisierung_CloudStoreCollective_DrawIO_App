template:
  # --- METADATA ---
  name: "drawio-server"
  display_name: "Draw.io Diagram Server"
  description: "Self-hosted Draw.io (diagrams.net) für kollaborative Diagramme — UML, Flowcharts, ER-Modelle. Läuft als Docker-Container, kein Login nötig."
  version: "1.0.0"
  category: "education"
  author: "DHBW CloudStore Team"
  icon: drawio.png

  terraform:
    working_dir: terraform/
    required_version: ">= 1.6.0"

  tags:
    - drawio
    - diagrams
    - whiteboard
    - education

  parameters:
    # --- Allgemein ---
    - name: app_name
      type: string
      description: "Name der Drawio-Instanz (z.B. wwi23sea-drawio)"
      required: true
      validation:
        pattern: "^[a-z0-9-]{3,20}$"
      x-ui:
        group: "Allgemein"
        order: 1
        icon: Server
        placeholder: "z.B. wwi23sea-drawio"
        hint: "Nur Kleinbuchstaben, Zahlen und Bindestriche (3-20 Zeichen)"

    # --- Ressourcen ---
    - name: flavor_name
      type: selection
      description: "Ressourcen (Quota)"
      required: true
      options:
        - label: "Small (1 CPU, 2GB RAM) — Empfohlen"
          value: "gp1.small"
        - label: "Medium (2 CPU, 4GB RAM)"
          value: "gp1.medium"
      default: "gp1.small"

  outputs:
    # SYSTEM PFLICHTFELDER (Hidden)
    - name: instance_id
      description: "System ID der Instanz"
      display: false

    - name: app_name
      description: "Name der Anwendung"
      display: true

    # USER OUTPUTS
    - name: drawio_url
      description: "Draw.io Web-Oberfläche"
      display: true

    - name: ssh_command
      description: "SSH-Zugang zur VM"
      display: true

    - name: ssh_private_key
      description: "SSH Private Key"
      sensitive: true
      display: false

  estimated_costs:
    hourly: "0.05 - 0.10 EUR"
    monthly: "40 - 75 EUR"

  requirements:
    - "SSH Port 22"
    - "HTTP Port 8080 (Draw.io Web UI)"
